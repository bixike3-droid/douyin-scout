[project]
name = "douyin-scout"
version = "0.1.0"
description = "抖音互动数据采集与分析框架（本地自用；登录态 / 匿名态分离，稳定优先）"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
    "Pillow>=10",
    "pypdf>=5",
    "pypdfium2>=4.30",
    "imageio-ffmpeg>=0.6",
    "py7zr>=1.0",
    "rarfile>=4.2",
    "striprtf>=0.0.29",
    "xlrd>=2.0",
    "pillow-heif>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
desktop = ["PySide6-Essentials==6.8.3"]
codex = ["openai-codex==0.163.0"]
web-desktop = ["PySide6-Essentials==6.8.3", "PySide6-Addons==6.8.3", "fastapi>=0.143,<0.144", "uvicorn[standard]>=0.54,<0.55"]
windows-desktop = ["pywebview==6.2.1", "pythonnet==3.2.1", "fastapi>=0.143,<0.144", "uvicorn[standard]>=0.54,<0.55", "openai-codex==0.163.0"]
workspace-python = ["openpyxl==3.1.5", "python-docx==1.2.0", "reportlab==5.1.0", "xlsxwriter==3.3.0"]

[project.scripts]
scout = "scout.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scout = ["db/migrations/*.sql", "desktop/assets/*.ico", "skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
