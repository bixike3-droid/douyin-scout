[project]
name = "douyin-scout"
version = "0.1.0"
description = "抖音互动数据采集与分析框架（本地自用；登录态 / 匿名态分离，稳定优先）"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
desktop = ["PySide6-Essentials==6.8.3"]

[project.scripts]
scout = "scout.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scout = ["db/migrations/*.sql", "web/static/*", "desktop/assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
