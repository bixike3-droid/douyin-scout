<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>douyin-scout 观测台</title>
<style>
  :root{
    --bg:#0f1116; --panel:#171a21; --panel2:#1d2129; --line:#2a2f3a;
    --fg:#e6e9ef; --dim:#8b93a7; --accent:#4ea1ff; --ok:#3ddc97; --warn:#ffb454; --bad:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  button.mini{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
              border-radius:7px;padding:4px 10px;cursor:pointer;font-size:12px}
  button.mini:hover{border-color:var(--accent);color:var(--accent)}
  #likerGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  input::placeholder{color:var(--dim)}
  .chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);
        border-radius:20px;padding:1px 9px;font-size:12px;margin-right:5px;color:var(--dim)}
  header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);
         padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:600}
  .tag{font-size:12px;color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block;margin-right:6px}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  main{padding:18px 20px 60px;max-width:1500px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .card .k{font-size:12px;color:var(--dim);margin-bottom:6px}
  .card .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
  .card .s{font-size:12px;color:var(--dim);margin-top:4px}
  nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  nav button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;
             padding:6px 14px;cursor:pointer;font-size:13px}
  nav button.active{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:600}
  section{display:none}
  section.active{display:block}
  table{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border-radius:10px;overflow:hidden}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis;max-width:340px}
  th{background:var(--panel2);color:var(--dim);font-weight:500;font-size:12px}
  tr:hover td{background:#1b1f28}
  .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)} .dim{color:var(--dim)}
  pre{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;
      overflow:auto;max-height:70vh;font-size:12.5px}
  .bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--accent)}
  .bar i.hot{background:var(--bad)}
  #log{background:#0b0d12;border:1px solid var(--line);border-radius:10px;padding:12px;height:260px;
       overflow:auto;font:12px/1.7 ui-monospace,Consolas,monospace}
  #log div{border-bottom:1px dashed #1c2028;padding:2px 0}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
</style>
</head>
<body>
<header>
  <h1>douyin-scout</h1>
  <span class="tag"><span class="dot" id="dot"></span><span id="conn">连接中…</span></span>
  <span class="tag" id="clock"></span>
  <span class="tag" id="acctTag">账号：读取中…</span>
  <span class="tag" style="margin-left:auto">只读观测台 · 采集请走 CLI</span>
</header>

<main>
  <div class="grid" id="cards"></div>

  <nav>
    <button data-tab="collect" class="active">采集</button>
    <button data-tab="ai">AI 画像</button>
    <button data-tab="likers">点赞人档案</button>
    <button data-tab="likerworks">点赞人作品</button>
    <button data-tab="coverage">名单完整性</button>
    <button data-tab="users">用户</button>
    <button data-tab="works">作品</button>
    <button data-tab="tasks">任务</button>
    <button data-tab="requests">请求日志</button>
    <button data-tab="raw">原始归档</button>
    <button data-tab="storage">存储</button>
    <button data-tab="config">配置</button>
    <button data-tab="report">画像报告</button>
    <button data-tab="events">实时日志</button>
  </nav>

  <section id="tab-collect" class="active">
    <div class="card" id="loginBox" style="margin-bottom:16px">
      <div class="row" style="align-items:center">
        <b>登录状态</b>
        <span id="loginText" class="dim">读取中…</span>
        <span style="margin-left:auto"></span>
        <button class="mini" id="loginStart">登录抖音</button>
        <button class="mini" id="loginRefresh" style="display:none">刷新二维码</button>
        <button class="mini" id="loginCancel" style="display:none">取消</button>
      </div>
      <div id="loginPanel" style="display:none;margin-top:12px">
        <div style="display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap">
          <div>
            <img id="loginQr" alt="登录二维码"
                 style="width:220px;height:220px;object-fit:contain;background:#fff;
                        border-radius:10px;padding:6px">
            <div class="s" style="margin-top:6px;text-align:center">用抖音 App 扫码</div>
          </div>
          <div style="flex:1;min-width:220px">
            <div id="loginMsg" style="white-space:pre-wrap"></div>
            <div class="s" id="loginHint" style="margin-top:10px;color:var(--dim);white-space:pre-wrap">
              手机抖音 → 右上角「扫一扫」→ 对着二维码扫
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row" style="margin-bottom:12px">
      <select id="colKind">
        <option value="">全部待办任务</option>
      </select>
      上限 <input id="colMax" type="number" value="30" min="1" max="500"
                  style="width:76px;background:var(--panel2);color:var(--fg);
                         border:1px solid var(--line);border-radius:8px;padding:5px 8px">
      <button class="mini" id="colStart">开始采集</button>
      <button class="mini" id="colStop" style="display:none">停止</button>
      <span class="dim" id="colStatus">读取中…</span>
    </div>

    <div id="colSummary" style="margin-bottom:14px"></div>

    <div class="bar" style="margin-bottom:6px"><i id="colBarFill" style="width:0%"></i></div>
    <div class="s" id="colProgress" style="margin-bottom:14px"></div>

    <div class="k" style="margin-bottom:6px">实时输出</div>
    <div id="colLog" style="background:#0b0d12;border:1px solid var(--line);border-radius:10px;
         padding:12px;height:340px;overflow-y:auto;font:12px/1.7 ui-monospace,
         Consolas,monospace;white-space:pre-wrap"></div>
  </section>
  <section id="tab-ai">
    <div class="row">
      <select id="aiScope">
        <option value="pending">只分析还没分析过的</option>
        <option value="all">全部重跑</option>
      </select>
      数量 <input id="aiLimit" type="number" value="30" min="1" max="200"
                  style="width:76px;background:var(--panel2);color:var(--fg);
                         border:1px solid var(--line);border-radius:8px;padding:5px 8px">
      <button class="mini" id="aiRun">开始分析</button>
      <button class="mini" id="aiPing">测试 API</button>
      <span class="dim" id="aiStatus"></span>
    </div>
    <div class="bar" style="margin-bottom:16px"><i id="aiBarFill" style="width:0%"></i></div>

    <div class="row" style="margin-bottom:16px">
      <button class="mini" id="rvRun">⑥ 评价我的作品</button>
      <button class="mini" id="plRun">⑦ 制定下一步计划</button>
      <button class="mini" id="cpRunAll">两个一起跑</button>
      <span class="dim" id="cpStatus"></span>
    </div>
    <div id="cpOut" style="margin-bottom:22px"></div>

    <div class="dim" style="margin:6px 0 12px">↓ 下面是每个点赞人的画像</div>
    <div id="aiGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px"></div>
  </section>
  <section id="tab-likers">
    <div id="workCards" class="grid"></div>
    <div class="row" style="margin-top:16px">
      <select id="likerWork"><option value="">全部作品</option></select>
      <input id="likerSearch" placeholder="搜索昵称或抖音号…"
             style="background:var(--panel2);color:var(--fg);border:1px solid var(--line);
                    border-radius:8px;padding:6px 10px;min-width:220px">
      <span class="dim" id="likerCount"></span>
    </div>
    <div id="likerGrid"></div>
  </section>
  <section id="tab-likerworks">
    <div class="row">
      <select id="uwAuthor"><option value="">全部点赞人</option></select>
      <input id="uwSearch" placeholder="搜索作品标题…"
             style="background:var(--panel2);color:var(--fg);border:1px solid var(--line);
                    border-radius:8px;padding:6px 10px;min-width:220px">
      <span class="dim" id="uwCount"></span>
    </div>
    <div id="uwList"></div>
  </section>
  <section id="tab-coverage">
    <div id="covVerdict"></div>
    <div id="coverage" style="margin-top:12px"></div>
  </section>
  <section id="tab-users">
    <div class="row">
      排序 <select id="userOrder"><option value="like_count">点赞次数</option><option value="fans">粉丝数</option><option value="recent">最近采集</option></select>
      状态 <select id="userState"><option value="">全部</option><option value="ok">ok</option><option value="pending">pending</option><option value="blocked">blocked</option><option value="error">error</option></select>
    </div>
    <div id="users"></div>
  </section>
  <section id="tab-works"><div id="works"></div></section>
  <section id="tab-tasks">
    <div class="row">状态 <select id="taskState"><option value="">全部</option><option value="pending">pending</option><option value="running">running</option><option value="done">done</option><option value="failed">failed</option></select></div>
    <div id="tasks"></div>
  </section>
  <section id="tab-requests">
    <div class="row">只看异常 <input type="checkbox" id="onlyProblem"></div>
    <div id="requests"></div>
  </section>
  <section id="tab-raw"><div id="raw"></div></section>
  <section id="tab-storage">
    <div class="row" style="margin-bottom:14px">
      <button class="mini" id="stCleanup">执行清理</button>
      <button class="mini" id="stRefresh">刷新</button>
      <span class="dim" id="stStatus"></span>
    </div>
    <div id="stCards" style="margin-bottom:16px"></div>
    <div class="k" style="margin-bottom:6px">按日期分布（主体是接口响应正文）</div>
    <div id="stDays"></div>
  </section>

  <section id="tab-config"><pre id="config">加载中…</pre></section>
  <section id="tab-report"><pre id="report">加载中…</pre></section>
  <section id="tab-events"><div id="log"></div></section>
</main>

<script>
const $ = s => document.querySelector(s);

function table(cols, rows, fmt){
  if(!rows || !rows.length) return '<div class="card dim">暂无数据</div>';
  const head = cols.map(c=>`<th>${c.label}</th>`).join('');
  const body = rows.map(r=>'<tr>'+cols.map(c=>`<td>${fmt(c, r)}</td>`).join('')+'</tr>').join('');
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}
const esc = v => (v===null||v===undefined||v==='') ? '<span class="dim">-</span>'
  : String(v).replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const num = v => (v===null||v===undefined) ? '<span class="dim">-</span>' : Number(v).toLocaleString();

async function get(path){ const r = await fetch(path); if(!r.ok) throw new Error(r.status); return r.json(); }

function card(k, v, s){ return `<div class="card"><div class="k">${k}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`; }

function renderCards(o){
  const u = o.users||{}, w = o.works||{}, l = o.like_edges||{}, q = o.quota||{}, rq = o.requests||{}, t = o.tasks||{};
  let html = '';
  html += card('点赞人', num(u.total), `待采 ${u.pending||0} · 已采 ${u.ok||0} · 缺口 ${u.wall||0}`);
  html += card('点赞边', num(l.total), `今日新增 ${num(l.today)}`);
  html += card('作品', num(w.total), `今日 ${w.today||0}`);
  html += card('请求 24h', num(rq.total), `成功 ${((rq.ok_rate||0)*100).toFixed(1)}% · 空返回 ${rq.empty||0}`);
  const tiers = Object.keys(q);
  for(const tier of tiers){
    const info = q[tier], pct = info.limit>0 ? Math.min(100, info.used/info.limit*100) : 0;
    html += `<div class="card"><div class="k">配额 ${tier}</div><div class="v">${info.used}<span class="dim" style="font-size:14px"> / ${info.limit||'∞'}</span></div>
      <div class="bar"><i class="${pct>85?'hot':''}" style="width:${pct}%"></i></div></div>`;
  }
  html += card('任务', num((t.pending||0)+(t.running||0)), `完成 ${t.done||0} · 失败 ${t.failed||0}`);
  const nc = o.notice_coverage || {};
  html += card('名单完整性',
    nc.runs_reached_end ? '<span class="ok">已触底</span>' : '<span class="warn">未验证</span>',
    `${nc.runs_total||0} 轮采集 · 不同点赞人 ${num(nc.distinct_likers)}`);
  const circ = (o.circuit||[]);
  const open = circ.filter(c=>c.state!=='closed');
  html += card('熔断', open.length ? `<span class="bad">${open.length} 个开启</span>` : '<span class="ok">全部正常</span>',
               open.map(c=>c.key).join(', '));
  $('#cards').innerHTML = html;
}

async function loadLikerWorks(){
  // 作者下拉：顺便显示每人采到了几个作品 —— 直接看出画像原料够不够
  const sel = $('#uwAuthor');
  if (sel.options.length <= 1) {
    const sum = await get('/api/likers/summary');
    sum.forEach(u=>{
      const o = document.createElement('option');
      o.value = u.sec_uid;
      o.textContent = `${u.nickname || u.sec_uid.slice(0,12)}（${u.works_have} 个作品）`;
      sel.appendChild(o);
    });
  }
  const sec = sel.value, q = $('#uwSearch').value.trim();
  const d = await get(`/api/user_works?sec_uid=${encodeURIComponent(sec)}&q=${encodeURIComponent(q)}&limit=500`);
  $('#uwCount').textContent = `共 ${d.total} 条，显示 ${d.returned}`;
  const rows = d.rows || [];
  if (!rows.length) {
    $('#uwList').innerHTML = '<div class="card dim">没有作品数据。先在终端跑：scout run --kind fetch_user_works</div>';
    return;
  }
  $('#uwList').innerHTML = `<table><thead><tr>
      <th>封面</th><th>作品标题</th><th>点赞</th><th>评论</th><th>发布</th><th>作者</th><th>数据时间</th>
    </tr></thead><tbody>` + rows.map(r=>{
    const cov = r.cover_url
      ? `<img src="${r.cover_url}" referrerpolicy="no-referrer" loading="lazy"
              style="width:56px;height:74px;object-fit:cover;border-radius:6px;background:var(--panel2)">`
      : '';
    const when = r.create_time ? new Date(r.create_time*1000).toLocaleDateString('zh-CN') : '—';
    // 时效：不标出来就等于把可能过期的数字当当前事实展示
    let age, ageTitle='';
    if (r.stats_unknown_time) { age = '<span class="warn">时间未知</span>'; }
    else if (r.stats_age_hours < 1) { age = '刚刚'; }
    else if (r.stats_age_hours < 24) { age = Math.round(r.stats_age_hours)+' 小时前'; }
    else {
      const d = Math.round(r.stats_age_hours/24);
      age = r.stats_stale ? `<span class="warn">${d} 天前（已过期）</span>` : `${d} 天前`;
    }
    // 合理性校验：反常数字标注出来，不篡改也不隐瞒
    const flag = r.stats_anomaly
      ? `<div class="warn" style="font-size:12px;margin-top:4px;white-space:normal">⚠ ${esc(r.stats_anomaly)}</div>`
      : '';
    return `<tr>
      <td style="max-width:70px">${cov}</td>
      <td style="white-space:normal;max-width:480px">${esc(r.description) || '<span class="dim">（无标题）</span>'}</td>
      <td>${num(r.digg_count)}</td>
      <td>${num(r.comment_count)}</td>
      <td>${when}</td>
      <td><a href="${r.author_url}" target="_blank" rel="noopener noreferrer">${esc(r.author_nickname) || '—'}</a></td>
      <td style="white-space:nowrap">${age}</td>
    </tr>${flag?`<tr><td colspan="7" style="border-top:none;padding-top:0">${flag}</td></tr>`:''}`;
  }).join('') + '</tbody></table>';
}

async function loadCoverage(){
  const d = await get('/api/coverage');
  const c = d.coverage || {};
  const cls = c.runs_reached_end ? 'ok' : (c.runs_total ? 'warn' : 'dim');
  $('#covVerdict').innerHTML = `<div class="card"><div class="k">结论</div>
    <div class="v" style="font-size:16px"><span class="${cls}">${esc(c.verdict)}</span></div>
    <div class="s">不同点赞人 ${num(c.distinct_likers)} ｜ 点赞边 ${num(c.like_edges)} ｜ 采集 ${c.runs_total||0} 轮，其中触底 ${c.runs_reached_end||0} 轮</div></div>`;
  $('#coverage').innerHTML = table([
    {k:'started_at',label:'时间'},{k:'tier',label:'档'},{k:'rounds',label:'轮数'},
    {k:'edges_seen',label:'看到'},{k:'new_edges',label:'新增'},{k:'distinct_likers',label:'不同人数'},
    {k:'reached_end',label:'触底'},{k:'stop_reason',label:'停止原因'}
  ], d.runs || [], (c2,r)=>{
    if(c2.k==='reached_end') return r[c2.k] ? '<span class="ok">✓</span>' : '<span class="bad">✗</span>';
    return esc(r[c2.k]);
  });
}
// ── AI 画像 ──────────────────────────────────────────────
const SCORE_COLOR = {5:'var(--ok)',4:'#7ee2b8',3:'var(--warn)',2:'#ff9a6b',1:'var(--bad)'};

function aiCard(r){
  let d = {};
  try { d = JSON.parse(r.output_json || '{}'); } catch(e) {}
  const score = Number(d.relevance_score) || 0;
  const stars = '★'.repeat(score) + '☆'.repeat(Math.max(0, 5 - score));
  const url = r.profile_url || '';
  const av = r.avatar_url
    ? `<img src="${r.avatar_url}" referrerpolicy="no-referrer" loading="lazy"
            style="width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--panel2)">`
    : `<div style="width:44px;height:44px;border-radius:50%;background:var(--panel2)"></div>`;
  const domains = (d.content_domains || []).map(x=>`<span class="chip">${esc(x)}</span>`).join('');
  return `<div class="card">
    <div style="display:flex;gap:11px;align-items:center">
      ${av}
      <div style="min-width:0;flex:1">
        <div style="font-weight:600"><a href="${url}" target="_blank" rel="noopener noreferrer"
             style="color:var(--fg);text-decoration:none">${esc(r.nickname)||'（未知）'}</a></div>
        <div class="s">抖音号 ${esc(r.douyin_id)||'—'} ｜ 粉丝 ${num(r.follower_count)}</div>
      </div>
      <div style="text-align:right">
        <div style="color:${SCORE_COLOR[score]||'var(--dim)'};font-size:15px;letter-spacing:1px">${stars}</div>
        <div class="k">相关性</div>
      </div>
    </div>
    <div style="margin:10px 0 8px">${domains}</div>
    ${d.persona ? `<div class="s" style="color:var(--fg)">${esc(d.persona)}</div>` : ''}
    <div class="s" style="margin-top:6px">
      <b>受众</b> ${esc(d.audience)||'—'}<br>
      <b>活跃</b> ${esc(d.activity_level)||'—'}（${esc(d.activity_reason)||'—'}）<br>
      <b>建议</b> <span style="color:var(--accent)">${esc(d.recommended_action)||'—'}</span>
    </div>
    ${d.summary ? `<div class="s" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line);white-space:normal">${esc(d.summary)}</div>` : ''}
    <div class="k" style="margin-top:8px">${esc(r.prompt_version||'')} · ${esc(r.model||'')} · ${num((r.prompt_tokens||0)+(r.completion_tokens||0))} tokens</div>
  </div>`;
}

// ── 创作者侧：作品评价 / 下一步计划 ──────────────────────
const PRIO_COLOR = {'高':'var(--ok)','中':'var(--warn)','低':'var(--dim)'};

function reviewCard(d, meta){
  const score = Number(d.score)||0;
  const li = (arr, color)=> (arr||[]).map(x=>
    `<li style="margin:3px 0${color?';color:'+color:''}">${esc(x)}</li>`).join('');
  return `<div class="card" style="border-color:var(--accent)">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <b style="font-size:15px">我的作品评价</b>
      <span style="color:${SCORE_COLOR[Math.round(score/2)]||'var(--dim)'};font-size:16px">
        ${score}/10</span>

  }
  if (r.plan) {

function runCreator(task){
  const label = task === 'plan' ? '制定下一步计划' : '评价我的作品';
  $('#cpStatus').textContent = `${label}中…（约 10-20 秒）`;
  const es = new EventSource(`/api/creator/stream?task=${task}&force=1`);
  es.onerror = ()=>{ $('#cpStatus').textContent = '连接断开'; es.close(); };
  es.onmessage = ev=>{
    const d = JSON.parse(ev.data);
    if (d.type === 'error') { $('#cpStatus').textContent = '错误：'+d.error; es.close(); return; }
    if (d.type === 'result') {
      $('#cpStatus').textContent = d.ok
        ? `✓ ${label}完成（${d.tokens} tokens，${d.duration_ms}ms）`
        : `✗ ${d.error}`;
    }
    if (d.type === 'done') { es.close(); loadCreator(); }
  };
}

// ── 网页扫码登录 ──────────────────────────────────────────
let loginES = null;

const LOGIN_STATE_TEXT = {
  idle: '未登录', starting: '正在启动浏览器…', waiting: '等待扫码',
  scanned: '已扫码，请在手机上确认', ok: '已登录', expired: '二维码超时',
  error: '登录失败', cancelled: '已取消',
};

async function loadLogin(){
  let s = {}, acct = {};
  try { s = await get('/api/login/status'); } catch(e) { s = {status:'idle'}; }
  try { acct = await get('/api/account'); } catch(e) {}
  renderLogin(s, acct);
}

function renderLogin(s, acct){
  acct = acct || {};
  const busy = !!s.active;
  const st = s.status || 'idle';

  $('#loginRefresh').style.display = busy ? '' : 'none';
  $('#loginCancel').style.display = busy ? '' : 'none';
  $('#loginStart').style.display = busy ? 'none' : '';
  $('#loginStart').textContent = $('#loginStart').textContent || '登录抖音';

  if (busy) $('#loginPanel').style.display = '';

  let text;
  if (busy) {
    text = LOGIN_STATE_TEXT[st] || st;
  } else if (st === 'ok' || acct.self_nickname) {
    text = `已登录：${s.nickname || acct.self_nickname || '（未知）'}`;
    $('#loginStart').textContent = '重新登录';
  } else {
    text = '未登录 —— 采集前需要扫码登录一次';
  }
  $('#loginText').textContent = text;
  $('#loginText').style.color = (st === 'ok' || acct.self_nickname) ? 'var(--ok)'
                              : st === 'error' ? 'var(--bad)' : 'var(--warn)';

  if (busy) {
    if (s.qr_source) {
      // 加时间戳破缓存，否则浏览器会一直显示旧二维码
      $('#loginQr').src = '/api/login/qr?t=' + Date.now();
      $('#loginHint').textContent = s.qr_source.indexOf('视口') >= 0
        ? '（没定位到二维码元素，这是整屏截图 —— 二维码在图里，请自行辨认）'
        : '手机抖音 → 右上角「扫一扫」→ 对着二维码扫';
    }
    $('#loginMsg').textContent = s.message || '正在准备…';
  }

  if (st === 'ok' && !busy) {
    $('#loginPanel').style.display = 'none';
    colLog(`登录成功：${s.nickname || ''}`, 'ok');
    loadCollect();
  }
  if (st === 'error' && !busy) {
    $('#loginMsg').textContent = s.error || s.message || '未知错误';
  }
}

function connectLogin(){
  if (loginES) { loginES.close(); loginES = null; }
  loginES = new EventSource('/api/login/stream');
  loginES.onmessage = ev=>{
    let d; try { d = JSON.parse(ev.data); } catch(e) { return; }
    if (d.type === 'closed') { loginES.close(); loginES = null; loadLogin(); return; }
    renderLogin(d, null);
  };
  loginES.onerror = ()=>{ /* EventSource 自动重连 */ };
}

$('#loginStart').onclick = async ()=>{
  $('#loginPanel').style.display = '';
  $('#loginQr').removeAttribute('src');
  $('#loginMsg').textContent = '正在启动浏览器，请稍候…';
  try {
    const r = await fetch('/api/login/start', {method:'POST'});
    const d = await r.json();
    if (!d.accepted) { alert(d.reason || '无法启动登录'); return; }
    if (!loginES || loginES.readyState === 2) connectLogin();
  } catch(e) { alert('启动失败：' + e.message); }
};

$('#loginRefresh').onclick = async ()=>{
  const r = await fetch('/api/login/refresh', {method:'POST'});
  const d = await r.json();
  if (!d.ok) alert(d.reason || '刷新失败');
};

$('#loginCancel').onclick = async ()=>{
  await fetch('/api/login/cancel', {method:'POST'});
  $('#loginPanel').style.display = 'none';
  loadLogin();
};

// ── 采集控制 ─────────────────────────────────────────────
const KIND_LABEL = {
  fetch_self:       '识别本人账号',
  fetch_likers:     '采点赞人名单',
  fetch_user_works: '采点赞人作品',
  fetch_notice:     '采互动消息',
  fetch_profile:    '采用户主页',
};
let colES = null;

function colLog(text, cls){
  const el = $('#colLog');
  const t = new Date().toLocaleTimeString('zh-CN', {hour12:false});
  const color = cls === 'ok' ? 'var(--ok)' : cls === 'bad' ? 'var(--bad)'
              : cls === 'warn' ? 'var(--warn)' : 'var(--fg)';
  el.innerHTML += `<div style="color:${color}">${t}  ${esc(text)}</div>`;
  el.scrollTop = el.scrollHeight;
}

async function loadCollect(){
  await loadLogin();
  let s = {};
  try { s = await get('/api/tasks/summary'); } catch(e) { s = {kinds:[], totals:{}}; }
  const kinds = s.kinds || [];

  // 填下拉框：只有有待办的才列出来
  const sel = $('#colKind');
  const cur = sel.value;
  sel.innerHTML = '<option value="">全部待办任务</option>';
  kinds.filter(k=>k.pending>0).forEach(k=>{
    const o = document.createElement('option');
    o.value = k.kind;
    o.textContent = `${KIND_LABEL[k.kind] || k.kind}（待办 ${k.pending}）`;
    sel.appendChild(o);
  });
  sel.value = cur;

  // 卡片：让用户知道"点下去会发生什么"
  $('#colSummary').innerHTML = kinds.length ? kinds.map(k=>`
    <div class="card" style="display:inline-block;min-width:170px;margin:0 10px 10px 0">
      <div class="k">${KIND_LABEL[k.kind] || k.kind}</div>
      <div class="v">${num(k.pending)}</div>
      <div class="s">待办 ｜ 已完成 ${num(k.done)}${k.failed?` ｜ 失败 ${num(k.failed)}`:''}</div>
    </div>`).join('') : '<div class="card dim">还没有任务。先点「开始采集」，系统会自动盘点。</div>';

  try {
    const st = await get('/api/collect/status');
    renderCollectState(st);
  } catch(e) {}
}

function renderCollectState(st){
  const running = st.busy;
  $('#colStart').style.display = running ? 'none' : '';
  $('#colStop').style.display = running ? '' : 'none';
  const s = st.state || {};
  if (running) {
    // 刚启动时 ready 还是 0（引擎正在盘点），这时候显示 0/0 会让人以为卡住了
    if (!s.ready && !s.attempted) {
      $('#colStatus').textContent = '正在盘点待办任务…';
      $('#colBarFill').style.width = '5%';
      $('#colProgress').textContent = '';
    } else {
      $('#colStatus').textContent =
        `采集中… ${s.attempted||0}/${s.ready||0}（成功 ${s.ok||0} 失败 ${s.failed||0}）`;
      const pct = s.ready ? Math.min(100, Math.round((s.attempted||0)/s.ready*100)) : 5;
      $('#colBarFill').style.width = pct + '%';
      $('#colProgress').textContent = `已跑 ${s.elapsed_s||0}s`;
    }
  } else if (s.run_id) {
    $('#colStatus').textContent = `空闲（上一轮：成功 ${s.ok||0}，失败 ${s.failed||0}）`;
    $('#colBarFill').style.width = '100%';
    $('#colProgress').textContent = s.stop_reason || '';
  } else {
    $('#colStatus').textContent = '空闲';
    $('#colBarFill').style.width = '0%';
  }
}

function connectCollect(){
  if (colES) { colES.close(); colES = null; }
  colES = new EventSource('/api/collect/stream');
  colES.onmessage = ev=>{
    let d; try { d = JSON.parse(ev.data); } catch(e) { return; }
    switch (d.type) {
      case 'snapshot':
        renderCollectState({busy: d.busy, state: d.state});
        break;
      case 'phase':
        colLog(d.text || d.phase, 'warn'); break;
      case 'seeded': {
        const c = d.counts || {};
        const parts = Object.entries(c).filter(([,v])=>v>0).map(([k,v])=>`${KIND_LABEL[k]||k} ${v}`);
        colLog(parts.length ? '盘点完毕，新入队：' + parts.join('，') : '盘点完毕，没有新任务', 'warn');
        break;
      }
      case 'start':
        colLog(`开始采集，待办 ${d.ready} 个`, 'warn');
        break;
      case 'task': {
        const ok = d.ok, empty = d.empty, blocked = d.blocked;
        const tag = blocked ? '[被拦]' : ok ? '[成功]' : empty ? '[空]' : '[失败]';
        const cls = blocked ? 'warn' : ok ? 'ok' : empty ? 'dim' : 'bad';
        const name = KIND_LABEL[d.kind] || d.kind;
        colLog(`${d.attempted}/${d.limit} ${tag} ${name} ${String(d.target).slice(0,26)} ` +
               `${d.parsed || ''} ${d.duration_ms}ms${d.error ? '  ' + d.error : ''}`, cls);
        break;
      }
      case 'done':
        colLog(`本轮结束：尝试 ${d.attempted}，成功 ${d.ok}，空 ${d.empty}，失败 ${d.failed}` +
               (d.stop_reason ? `　（${d.stop_reason}）` : ''), 'ok');
        $('#colBarFill').style.width = '100%';
        loadCollect(); loadAI();
        break;
      case 'error':
        colLog('采集出错：' + d.error, 'bad'); break;
      case 'stopped':
        colLog('已手动停止', 'warn'); break;
      case 'idle':
        renderCollectState({busy: false, state: d.state});
        break;
    }
  };
  colES.onerror = ()=>{ /* EventSource 会自动重连，不关掉 */ };
}

$('#colStart').onclick = async ()=>{
  const kinds = $('#colKind').value, max_tasks = $('#colMax').value;
  $('#colLog').innerHTML = '';
  try {
    const r = await fetch(`/api/collect/start?kinds=${encodeURIComponent(kinds)}&max_tasks=${max_tasks}`,
                          {method:'POST'});
    const d = await r.json();
    if (!d.accepted) { alert(d.reason || '无法启动'); return; }
    colLog(`已启动，run_id=${d.run_id}`, 'warn');
    if (!colES || colES.readyState === 2) connectCollect();
  } catch(e) { alert('启动失败：' + e.message); }
};

$('#colStop').onclick = async ()=>{
  if (!confirm('确定停止本轮采集？正在跑的任务会中断，下次会自动捞回。')) return;
  await fetch('/api/collect/stop', {method:'POST'});
};

async function loadAI(){
  await loadCreator();
  // 账号标识必须一直可见 —— 看不到就会发生"以为在看 A 号数据，其实是 B 号的"
  try {
    const acct = await get('/api/account');
    const tag = document.getElementById('acctTag');
    if (tag) {
      tag.textContent = `账号：${acct.account}（${acct.self_nickname || '未采集身份'}）`;
      tag.title = `数据目录 ${acct.data_dir}\n所有账号：${(acct.all_accounts||[]).join(', ')}`;
      tag.style.color = (acct.all_accounts||[]).length > 1 ? 'var(--warn)' : 'var(--dim)';
    }
  } catch(e) {}
  const rows = await get('/api/analyses');
  const st = await get('/api/llm/status');
  $('#aiStatus').textContent = st.enabled
    ? `模型 ${st.model} ｜ 已分析 ${rows.length} 人 ｜ 累计 ${num(st.usage.prompt_tokens + st.usage.completion_tokens)} tokens`
    : '未配置 API Key（config/llm.local.yaml）';
  $('#aiGrid').innerHTML = rows.length ? rows.map(aiCard).join('')
    : '<div class="card dim">还没有画像。点「开始分析」生成。</div>';
}

function runAI(){
  const scope = $('#aiScope').value, limit = $('#aiLimit').value;
  const fill = $('#aiBarFill');
  fill.style.width = '0%';
  $('#aiGrid').innerHTML = '';
  const cards = [];
  let total = 0, done = 0;
  const es = new EventSource(`/api/analyze/stream?scope=${scope}&limit=${limit}&force=${scope==='all'?1:0}`);
  $('#aiStatus').textContent = '连接中…';
  es.onerror = ()=>{ $('#aiStatus').textContent = '连接断开'; es.close(); };
  es.onmessage = ev=>{
    const d = JSON.parse(ev.data);
    if (d.type === 'error') { $('#aiStatus').textContent = '错误：' + d.error; es.close(); return; }
    if (d.type === 'start') { total = d.total; $('#aiStatus').textContent = `开始分析 ${total} 人…`; }
    if (d.type === 'start_item') {
      $('#aiStatus').textContent = `分析中 ${d.index}/${d.total}…`;
    }
    if (d.type === 'item') {
      done = d.index;
      fill.style.width = total ? Math.round(done/total*100)+'%' : '0%';
      if (d.ok && d.data) {
        cards.push({nickname:'（生成中）', output_json: JSON.stringify(d.data),
                    prompt_version:'v1', model:'', prompt_tokens:d.tokens, completion_tokens:0,
                    profile_url:''});
      }
    }
    if (d.type === 'done') {
      es.close();
      $('#aiStatus').textContent = d.total
        ? `完成：成功 ${d.ok}，失败 ${d.failed}`
        : (d.message || '没有需要分析的对象');
      fill.style.width = '100%';
      loadAI();
    }
  };
}

$('#aiRun').onclick = runAI;

  $('#aiStatus').textContent = '测试中…';
  const r = await get('/api/llm/status?ping=1');

    {k:'following_count',label:'关注'},{k:'region',label:'地区'},{k:'like_count',label:'点赞次数'},
    {k:'profile_state',label:'状态'},{k:'last_seen_at',label:'最近采集'},{k:'sec_uid',label:'sec_uid'}
  ], rows, (c,r)=> ['follower_count','following_count','like_count'].includes(c.k)?num(r[c.k]):esc(r[c.k]));
}
async function loadWorks(){

// ── 存储与保留策略 ────────────────────────────────────────
async function loadStorage(){
  let d = {};
  try { d = await get('/api/storage'); } catch(e) {
    $('#stCards').innerHTML = '<div class="card dim">读取失败：' + e.message + '</div>';
    return;
  }
  const a = d.archive || {}, p = d.plan || {}, t = d.thresholds || {};

  const card = (k, v, s) => `<div class="card" style="display:inline-block;min-width:190px;margin:0 10px 10px 0">
      <div class="k">${k}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;

  $('#stCards').innerHTML =
    card('归档正文', `${a.disk_mb} MB`, `${a.disk_files} 个文件`) +
    card('归档记录', num(a.rows), `已清正文 ${num(a.pruned_rows)} 条`) +
    card('保留策略', `${t.raw_retention_days} 天`, `日志 ${t.log_retention_days} 天 · 任务 ${t.task_retention_days} 天`) +
    card('最早归档', (a.oldest||'—').slice(0,10), '');

  const todo = [];
  if (p.raw_files) todo.push(`① 归档正文：删 ${p.raw_files} 个文件（${p.raw_mb} MB）`);
  const logs = Object.entries(p.log_rows||{}).map(([k,v])=>`${k} ${v} 行`).join('、');
  if (logs) todo.push(`② 日志：${logs}`);
  if (p.unconfirmed_edges) todo.push(`③ 点赞边：标记陈旧 ${p.unconfirmed_edges} 条（不删除）`);
  if (p.task_rows) todo.push(`④ 已完成任务：删 ${p.task_rows} 行`);

  $('#stStatus').textContent = todo.length ? `待清理 ${todo.length} 项` : '没有需要清理的内容';
  $('#stCards').innerHTML += `<div class="card" style="width:100%;margin-top:6px">
    <div class="k">按当前策略，下次清理会处理</div>
    <div class="s" style="white-space:pre-wrap;margin-top:6px">${
      todo.length ? esc(todo.join('\n')) : '（无）'}</div>
    <div class="s" style="margin-top:8px;color:var(--dim)">
      删的是归档正文，元数据会保留 —— "曾经采过什么"仍可追溯；
      陈旧的点赞边只标记不删除（可能是接口偶发）。</div>
  </div>`;

  const days = (a.days || []).slice().reverse();
  $('#stDays').innerHTML = days.length ? `<table><thead><tr>
      <th>日期</th><th>文件数</th><th>占用</th></tr></thead><tbody>` +
    days.map(x=>`<tr><td>${esc(x.date)}</td><td>${num(x.files)}</td><td>${x.mb} MB</td></tr>`).join('') +
    '</tbody></table>' : '<div class="card dim">归档目录是空的</div>';
}

$('#stRefresh').onclick = loadStorage;
$('#stCleanup').onclick = async ()=>{
  if (!confirm('执行清理？\n\n• 会删除超过保留期的归档正文（元数据保留）\n• 会删除超期日志\n• 陈旧的点赞边只会标记，不会删除\n\n确定继续？')) return;
  $('#stStatus').textContent = '清理中…';
  try {
    const r = await fetch('/api/storage/cleanup', {method:'POST'});
    const d = await r.json();
    if (d.cleaned) {
      $('#stStatus').textContent =
        `✓ 已删 ${d.files_deleted} 个文件，释放 ${(d.bytes_freed/1048576).toFixed(2)} MB` +
        `，标记陈旧边 ${d.edges_marked} 条，删任务 ${d.tasks_deleted} 行`;
    } else {
      $('#stStatus').textContent = d.reason || '没有需要清理的';
    }
    loadStorage();
  } catch(e) { $('#stStatus').textContent = '失败：' + e.message; }
};

async function loadConfig(){ try{ $('#config').textContent = JSON.stringify(await get('/api/config'), null, 2);}catch(e){ $('#config').textContent = '加载失败：'+e.message; } }
async function loadReport(){ try{ $('#report').textContent = (await get('/api/report')).markdown; }catch(e){ $('#report').textContent = '加载失败：'+e.message; } }

    btn.classList.add('active');

$('#uwAuthor').onchange = loadLikerWorks;
let uwTimer = null;
$('#uwSearch').oninput = ()=>{ clearTimeout(uwTimer); uwTimer = setTimeout(loadLikerWorks, 300); };
let searchTimer = null;
$('#likerSearch').oninput = ()=>{ clearTimeout(searchTimer); searchTimer = setTimeout(loadLikers, 300); };

const LOADERS = {collect:loadCollect, storage:loadStorage, ai:loadAI, coverage:loadCoverage, likers:loadLikers, likerworks:loadLikerWorks,
                 users:loadUsers, works:loadWorks, tasks:loadTasks,
                 requests:loadRequests, raw:loadRaw, config:loadConfig, report:loadReport};
function reload(tab){
  if(tab==='events' || !LOADERS[tab]) return;
  LOADERS[tab]().catch(e=>{ document.getElementById(tab).innerHTML = `<div class="card bad">加载失败：${e.message}</div>`; });
}

// ── SSE 实时流 ────────────────────────────────────────────
function pushLog(line, cls){
  const box = $('#log');
  const div = document.createElement('div');
  const t = new Date().toLocaleTimeString('zh-CN');
  div.innerHTML = `<span class="dim">${t}</span> <span class="${cls||''}">${line}</span>`;
  box.prepend(div);
  while(box.childElementCount > 300) box.removeChild(box.lastChild);
}
function connect(){
  const es = new EventSource('/api/stream');
  es.onopen = ()=>{ $('#dot').classList.add('on'); $('#conn').textContent = '已连接'; };
  es.onerror = ()=>{ $('#dot').classList.remove('on'); $('#conn').textContent = '断线重连中…'; };
  es.onmessage = ev=>{
    const data = JSON.parse(ev.data);
    if(data.error){ pushLog('采集端错误：'+data.error, 'bad'); return; }
    if(data.overview) renderCards(data.overview);
    (data.events||[]).forEach(e=>{
      const cls = e.level==='error' ? 'bad' : e.level==='warn' ? 'warn' : '';
      pushLog(`[${e.level}] ${e.scope} ${e.message}`, cls);
    });
    $('#clock').textContent = '更新于 ' + new Date(data.ts).toLocaleTimeString('zh-CN');
  };
}

(async function boot(){
  try{ renderCards(await get('/api/overview')); }catch(e){ $('#cards').innerHTML = `<div class="card bad">无法读取数据库：${e.message}。请先在终端运行 <code>scout init</code>。</div>`; }
  reload('collect');
  connectCollect();
  connectLogin();
  connect();
  setInterval(()=>{ const active = document.querySelector('nav button.active'); if(active) reload(active.dataset.tab); }, 15000);
})();
</script>
